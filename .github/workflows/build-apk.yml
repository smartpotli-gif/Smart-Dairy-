name: Build APK
on:
  push:
    branches: [ main ]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Unpack project zip
        run: |
          z=$(find . -maxdepth 3 -name "smart_diary_flutter*.zip" -not -path './.git/*' | head -1)
          if [ -z "$z" ]; then echo "ZIP NOT FOUND - upload smart_diary_flutter.zip"; exit 1; fi
          echo "Using $z"
          unzip -o "$z" -d .
          ls; ls lib
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.24.5"
          channel: stable
      - name: Create Android scaffolding (keeps our files)
        run: flutter create --platforms=android --org com.smartpotli --project-name smart_diary .
      - name: Enable desugaring
        run: python3 tool/patch_android.py
      - name: Signing key (fixed, so updates keep data)
        run: |
          mkdir -p ~/.android
          if [ -f signing/debug.keystore ]; then
            cp signing/debug.keystore ~/.android/debug.keystore
          else
            cp tool/debug.keystore ~/.android/debug.keystore
          fi
      - run: flutter pub get
      - name: Build release APK
        run: flutter build apk --release
      - uses: actions/upload-artifact@v4
        with:
          name: SmartDiary-APK
          path: build/app/outputs/flutter-apk/app-release.apk
